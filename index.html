<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TCS34725 Kleurdetectie</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0e0e11;
        --surface: #18181f;
        --border: #2a2a35;
        --text: #e8e8f0;
        --muted: #6b6b80;
        --accent: #c8ff00;
        --radius: 12px;
        --current-r: 0;
        --current-g: 0;
        --current-b: 0;
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Syne", sans-serif;
        overflow-x: hidden;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        grid-template-columns: 1fr 340px;
        grid-template-areas:
          "header  header"
          "main    sidebar"
          "history history";
        gap: 1px;
        background: var(--border);
      }

      header {
        grid-area: header;
        background: var(--surface);
        padding: 20px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .logo {
        display: flex;
        align-items: baseline;
        gap: 12px;
      }
      .logo-title {
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .logo-sub {
        font-family: "Space Mono", monospace;
        font-size: 0.7rem;
        color: var(--muted);
        letter-spacing: 0.05em;
      }

      .status-pill {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 999px;
        border: 1px solid var(--border);
        font-family: "Space Mono", monospace;
        font-size: 0.7rem;
        color: var(--muted);
        transition: all 0.3s;
      }
      .status-pill.connected {
        border-color: var(--accent);
        color: var(--accent);
      }
      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
        transition: background 0.3s;
      }
      .status-pill.connected .status-dot {
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent);
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      /* ── MAIN ─────────────────────────────────────────── */
      main {
        grid-area: main;
        background: var(--surface);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px;
        position: relative;
        overflow: hidden;
      }

      /* De twee cirkels naast elkaar */
      .circles-row {
        display: flex;
        align-items: center;
        gap: 48px;
      }

      .circle-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .circle-caption {
        font-family: "Space Mono", monospace;
        font-size: 0.65rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* Gemeten kleur */
      .color-display {
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: rgb(var(--current-r), var(--current-g), var(--current-b));
        transition: background 0.25s ease;
        position: relative;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.06),
          0 0 60px -10px
            rgba(var(--current-r), var(--current-g), var(--current-b), 0.6);
      }

      .color-display.none-state {
        background: #1e1e28 !important;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04) !important;
      }

      .color-display::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          rgba(255, 255, 255, 0.12),
          transparent 60%
        );
        pointer-events: none;
      }

      /* Referentiekleur */
      .ref-display {
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: #1e1e28;
        transition:
          background 0.4s ease,
          box-shadow 0.4s ease;
        position: relative;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04);
        border: 2px dashed var(--border);
      }

      .ref-display.active {
        border: none;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.06),
          0 0 60px -10px var(--ref-glow, #ffffff33);
      }

      .ref-display::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          rgba(255, 255, 255, 0.1),
          transparent 60%
        );
        pointer-events: none;
      }

      /* Scheidingslijn / pijl tussen de cirkels */
      .circle-divider {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }

      .circle-divider .arrow-line {
        width: 1px;
        height: 40px;
        background: var(--border);
      }

      .circle-divider .arrow-icon {
        font-family: "Space Mono", monospace;
        font-size: 1rem;
        color: var(--border);
      }

      /* Naam onderaan */
      .color-name-display {
        margin-top: 32px;
        font-size: 3rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        color: var(--text);
        transition: opacity 0.2s;
        min-height: 3.6rem;
        text-align: center;
      }

      .color-name-display.none-state {
        color: var(--muted);
      }

      /* ── SIDEBAR ─────────────────────────────────────────── */
      .sidebar {
        grid-area: sidebar;
        background: var(--surface);
        padding: 32px 28px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      .sidebar-block {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .block-label {
        font-family: "Space Mono", monospace;
        font-size: 0.65rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }

      .channel-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .channel-label {
        font-family: "Space Mono", monospace;
        font-size: 0.75rem;
        font-weight: 700;
        width: 16px;
        flex-shrink: 0;
      }
      .channel-bar-wrap {
        flex: 1;
        height: 6px;
        background: var(--border);
        border-radius: 3px;
        overflow: hidden;
      }
      .channel-bar {
        height: 100%;
        border-radius: 3px;
        width: 0%;
        transition: width 0.25s ease;
      }
      .channel-bar.r {
        background: #ff5555;
      }
      .channel-bar.g {
        background: #55ff88;
      }
      .channel-bar.b {
        background: #5599ff;
      }
      .channel-value {
        font-family: "Space Mono", monospace;
        font-size: 0.75rem;
        color: var(--text);
        width: 30px;
        text-align: right;
        flex-shrink: 0;
      }

      .hex-value {
        font-family: "Space Mono", monospace;
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: var(--text);
        padding: 14px 16px;
        background: var(--bg);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        text-align: center;
        cursor: pointer;
        transition: border-color 0.2s;
        user-select: all;
      }
      .hex-value:hover {
        border-color: var(--accent);
      }
      .hex-copy-hint {
        font-family: "Space Mono", monospace;
        font-size: 0.6rem;
        color: var(--muted);
        text-align: center;
        margin-top: -6px;
      }

      /* Referentie hex in sidebar */
      .ref-hex-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .ref-swatch {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        background: #1e1e28;
        border: 1px solid var(--border);
        flex-shrink: 0;
        transition: background 0.3s;
      }

      .ref-hex-label {
        font-family: "Space Mono", monospace;
        font-size: 0.85rem;
        color: var(--muted);
        flex: 1;
      }

      .ref-hex-val {
        font-family: "Space Mono", monospace;
        font-size: 0.85rem;
        color: var(--text);
      }

      .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }a
      .stat-box {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 16px;
      }
      .stat-box .stat-num {
        font-family: "Space Mono", monospace;
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--accent);
      }
      .stat-box .stat-lbl {
        font-family: "Space Mono", monospace;
        font-size: 0.6rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-top: 2px;
      }

      /* ── GESCHIEDENIS ─────────────────────────────────────── */
      .history-bar {
        grid-area: history;
        background: var(--surface);
        padding: 20px 32px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .history-label {
        font-family: "Space Mono", monospace;
        font-size: 0.65rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .history-list {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 4px;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }

      .history-item {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        opacity: 0;
        transform: translateY(8px);
        animation: slideIn 0.3s forwards;
      }
      @keyframes slideIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .history-swatch {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        flex-shrink: 0;
      }
      .history-name {
        font-family: "Space Mono", monospace;
        font-size: 0.6rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .history-hex {
        font-family: "Space Mono", monospace;
        font-size: 0.55rem;
        color: var(--border);
      }
      .history-empty {
        font-family: "Space Mono", monospace;
        font-size: 0.7rem;
        color: var(--border);
        align-self: center;
      }

      #reconnect-notice {
        display: none;
        position: fixed;
        top: 16px;
        right: 16px;
        padding: 12px 20px;
        background: #2a1515;
        border: 1px solid #cc3333;
        border-radius: var(--radius);
        font-family: "Space Mono", monospace;
        font-size: 0.72rem;
        color: #ff6666;
        z-index: 100;
        animation: fadeIn 0.3s;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @media (max-width: 700px) {
        .shell {
          grid-template-columns: 1fr;
          grid-template-areas: "header" "main" "sidebar" "history";
        }
        .circles-row {
          flex-direction: column;
          gap: 32px;
        }
        .circle-divider {
          flex-direction: row;
        }
        .circle-divider .arrow-line {
          width: 40px;
          height: 1px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <!-- HEADER -->
      <header>
        <div class="logo">
          <span class="logo-title">TCS34725</span>
          <span class="logo-sub">Raspberry Pi Pico · MicroPython · I²C</span>
        </div>
        <div class="status-pill" id="status-pill">
          <div class="status-dot"></div>
          <span id="status-text">Verbinden...</span>
        </div>
      </header>

      <!-- MAIN -->
      <main>
        <div class="circles-row">
          <!-- Gemeten kleur -->
          <div class="circle-wrap">
            <div class="color-display none-state" id="color-circle"></div>
            <div class="circle-caption">Gemeten</div>
          </div>

          <!-- Scheidingslijn -->
          <div class="circle-divider">
            <div class="arrow-line"></div>
            <div class="arrow-icon">↔</div>
            <div class="arrow-line"></div>
          </div>

          <!-- Referentiekleur -->
          <div class="circle-wrap">
            <div class="ref-display" id="ref-circle"></div>
            <div class="circle-caption">Referentie</div>
          </div>
        </div>

        <div class="color-name-display none-state" id="color-name">—</div>
      </main>

      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="sidebar-block">
          <div class="block-label">RGB Kanalen</div>
          <div class="channel-row">
            <span class="channel-label" style="color: #ff5555">R</span>
            <div class="channel-bar-wrap">
              <div class="channel-bar r" id="bar-r"></div>
            </div>
            <span class="channel-value" id="val-r">0</span>
          </div>
          <div class="channel-row">
            <span class="channel-label" style="color: #55ff88">G</span>
            <div class="channel-bar-wrap">
              <div class="channel-bar g" id="bar-g"></div>
            </div>
            <span class="channel-value" id="val-g">0</span>
          </div>
          <div class="channel-row">
            <span class="channel-label" style="color: #5599ff">B</span>
            <div class="channel-bar-wrap">
              <div class="channel-bar b" id="bar-b"></div>
            </div>
            <span class="channel-value" id="val-b">0</span>
          </div>
        </div>

        <div class="sidebar-block">
          <div class="block-label">HEX Waarde</div>
          <div
            class="hex-value"
            id="hex-value"
            onclick="copyHex()"
            title="Klik om te kopiëren"
          >
            #000000
          </div>
          <div class="hex-copy-hint">klik om te kopiëren</div>
        </div>

        <div class="sidebar-block">
          <div class="block-label">Referentiekleur</div>
          <div class="ref-hex-row">
            <div class="ref-swatch" id="ref-swatch"></div>
            <span class="ref-hex-label" id="ref-name-label">—</span>
            <span class="ref-hex-val" id="ref-hex-label">—</span>
          </div>
        </div>

        <div class="sidebar-block">
          <div class="block-label">Statistieken</div>
          <div class="stat-grid">
            <div class="stat-box">
              <div class="stat-num" id="stat-total">0</div>
              <div class="stat-lbl">Metingen</div>
            </div>
            <div class="stat-box">
              <div class="stat-num" id="stat-detected">0</div>
              <div class="stat-lbl">Herkend</div>
            </div>
          </div>
        </div>
      </aside>

      <!-- GESCHIEDENIS -->
      <div class="history-bar">
        <div class="history-label">Geschiedenis</div>
        <div class="history-list" id="history-list">
          <span class="history-empty">Nog geen kleuren herkend</span>
        </div>
      </div>
    </div>

    <div id="reconnect-notice">⚠ Verbinding verbroken — herverbinden...</div>

    <script>
      const WS_URL = "ws://localhost:8765";
      const MAX_HISTORY = 30;

      // ── Referentiekleuren (echte, pure versies per naam) ──────────
      // Voeg hier namen toe die je Pico verstuurt; naam is case-insensitive
      const REFERENCE_COLORS = {
        rood: "#FF0000",

        groen: "#00AA00",

        blauw: "#0055FF",

        geel: "#FFE000",
        yellow: "#FFE000",
        oranje: "#FF7700",
        orange: "#FF7700",
        paars: "#8800CC",

        roze: "#FF44AA",

        wit: "#FFFFFF",

        zwart: "#111111",

        grijs: "#888888",

        cyaan: "#00CCCC",
      };

      function getReferenceColor(name) {
        return REFERENCE_COLORS[name.toLowerCase()] || null;
      }

      function hexToRgb(hex) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return { r, g, b };
      }

      // ── State ─────────────────────────────────────────────────────
      let ws = null;
      let totalMeasurements = 0;
      let detectedMeasurements = 0;
      let history = [];
      let lastDetectedName = null;
      let reconnectTimer = null;

      // ── DOM ───────────────────────────────────────────────────────
      const circle = document.getElementById("color-circle");
      const refCircle = document.getElementById("ref-circle");
      const nameEl = document.getElementById("color-name");
      const barR = document.getElementById("bar-r");
      const barG = document.getElementById("bar-g");
      const barB = document.getElementById("bar-b");
      const valR = document.getElementById("val-r");
      const valG = document.getElementById("val-g");
      const valB = document.getElementById("val-b");
      const hexEl = document.getElementById("hex-value");
      const statTotal = document.getElementById("stat-total");
      const statDet = document.getElementById("stat-detected");
      const histList = document.getElementById("history-list");
      const statusPill = document.getElementById("status-pill");
      const statusText = document.getElementById("status-text");
      const reconnNotice = document.getElementById("reconnect-notice");
      const refSwatch = document.getElementById("ref-swatch");
      const refNameLabel = document.getElementById("ref-name-label");
      const refHexLabel = document.getElementById("ref-hex-label");

      // ── Helpers ───────────────────────────────────────────────────
      function toHex(n) {
        return n.toString(16).padStart(2, "0").toUpperCase();
      }
      function rgbToHex(r, g, b) {
        return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
      }

      function copyHex() {
        const hex = hexEl.textContent;
        navigator.clipboard.writeText(hex).then(() => {
          hexEl.textContent = "Gekopieerd!";
          setTimeout(() => (hexEl.textContent = hex), 1200);
        });
      }

      // ── UI update ─────────────────────────────────────────────────
      function updateUI(data) {
        const { r, g, b, name } = data;
        const isNone = name === "none";

        totalMeasurements++;
        statTotal.textContent = totalMeasurements;

        // Gemeten kleurcirkel
        if (isNone) {
          circle.classList.add("none-state");
          circle.style.background = "";
          circle.style.boxShadow = "";
          nameEl.textContent = "—";
          nameEl.classList.add("none-state");
          // Reset referentiecirkel
          refCircle.classList.remove("active");
          refCircle.style.background = "";
          refCircle.style.boxShadow = "";
          refSwatch.style.background = "";
          refNameLabel.textContent = "—";
          refHexLabel.textContent = "—";
        } else {
          circle.classList.remove("none-state");
          circle.style.background = `rgb(${r},${g},${b})`;
          circle.style.boxShadow = `0 0 0 1px rgba(255,255,255,0.06), 0 0 80px -10px rgba(${r},${g},${b},0.7)`;
          nameEl.textContent = name.toUpperCase();
          nameEl.classList.remove("none-state");
          detectedMeasurements++;
          statDet.textContent = detectedMeasurements;

          // Referentiecirkel
          const refHex = getReferenceColor(name);
          if (refHex) {
            const rc = hexToRgb(refHex);
            refCircle.classList.add("active");
            refCircle.style.background = refHex;
            refCircle.style.setProperty(
              "--ref-glow",
              `rgba(${rc.r},${rc.g},${rc.b},0.6)`,
            );
            refCircle.style.boxShadow = `0 0 0 1px rgba(255,255,255,0.06), 0 0 60px -10px rgba(${rc.r},${rc.g},${rc.b},0.6)`;
            refSwatch.style.background = refHex;
            refNameLabel.textContent =
              name.charAt(0).toUpperCase() + name.slice(1).toLowerCase();
            refHexLabel.textContent = refHex;
          } else {
            // Geen bekende referentie: toon gemeten kleur als fallback
            refCircle.classList.add("active");
            refCircle.style.background = `rgb(${r},${g},${b})`;
            refCircle.style.boxShadow = `0 0 0 1px rgba(255,255,255,0.06)`;
            refSwatch.style.background = `rgb(${r},${g},${b})`;
            refNameLabel.textContent = name;
            refHexLabel.textContent = "—";
          }
        }

        // RGB bars
        barR.style.width = `${(r / 255) * 100}%`;
        barG.style.width = `${(g / 255) * 100}%`;
        barB.style.width = `${(b / 255) * 100}%`;
        valR.textContent = r;
        valG.textContent = g;
        valB.textContent = b;
        hexEl.textContent = rgbToHex(r, g, b);

        // Geschiedenis
        if (!isNone && name !== lastDetectedName) {
          lastDetectedName = name;
          addHistory(r, g, b, name);
        }
      }

      function addHistory(r, g, b, name) {
        const empty = histList.querySelector(".history-empty");
        if (empty) empty.remove();

        const hex = rgbToHex(r, g, b);
        const item = document.createElement("div");
        item.className = "history-item";
        item.innerHTML = `
    <div class="history-swatch" style="background:rgb(${r},${g},${b})"></div>
    <div class="history-name">${name}</div>
    <div class="history-hex">${hex}</div>
  `;
        histList.insertBefore(item, histList.firstChild);
        history.unshift({ r, g, b, name });
        if (history.length > MAX_HISTORY) {
          history.pop();
          if (histList.lastChild) histList.removeChild(histList.lastChild);
        }
      }

      // ── WebSocket ─────────────────────────────────────────────────
      function connect() {
        ws = new WebSocket(WS_URL);

        ws.onopen = () => {
          statusPill.classList.add("connected");
          statusText.textContent = "Verbonden";
          reconnNotice.style.display = "none";
          if (reconnectTimer) {
            clearTimeout(reconnectTimer);
            reconnectTimer = null;
          }
        };

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            updateUI(data);
          } catch (e) {
            console.warn("Ongeldig bericht:", event.data);
          }
        };

        ws.onclose = () => {
          statusPill.classList.remove("connected");
          statusText.textContent = "Verbroken";
          reconnNotice.style.display = "block";
          reconnectTimer = setTimeout(connect, 2000);
        };

        ws.onerror = () => {
          ws.close();
        };
      }

      connect();
    </script>
  </body>
</html>
